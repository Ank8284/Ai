<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Chat Problem Solver</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; }
        .chat-container { width: 50%; margin-top: 20px; background: #1e1e1e; border-radius: 12px; padding: 15px; }
        .messages { height: 400px; overflow-y: auto; padding: 10px; background: #2b2b2b; border-radius: 6px; }
        .message { padding: 8px; margin: 6px 0; border-radius: 6px; }
        .user { color: #4caf50; font-weight: bold; }
        .input-container { display: flex; margin-top: 12px; gap: 8px; }
        input, button { padding: 12px; border: none; border-radius: 6px; }
        input { flex: 1; background: #333; color: white; }
        button { background: #4caf50; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>Chat with LLM Problem Solver</h2>
        <div class="messages" id="messages"></div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
        <input type="file" id="fileInput" onchange="uploadFile()">
    </div>
    <script>
        const API_URL = "http://127.0.0.1:8000";  // backend to be run on localhost

        async function sendMessage() {
            let input = document.getElementById("messageInput");
            let messageText = input.value.trim();
            if (!messageText) return;

            let messagesDiv = document.getElementById("messages");
            let userMessage = document.createElement("div");
            userMessage.classList.add("message", "user");
            userMessage.innerHTML = `<span class='user'>You:</span> ${messageText}`;
            messagesDiv.appendChild(userMessage);

            try {
                let response = await fetch(`${API_URL}/chat`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer your_actual_token_here"  // Ensure correct token is used
                    },
                    body: JSON.stringify({ message: messageText })
                });

                let data = await response.json();
                let aiText = data.choices ? data.choices[0].message.content : "No response";

                let aiMessage = document.createElement("div");
                aiMessage.classList.add("message");
                aiMessage.innerHTML = `<span class='user'>AI:</span> ${aiText}`;
                messagesDiv.appendChild(aiMessage);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (error) {
                console.error("Error:", error);
            }

            input.value = "";
        }

        async function uploadFile() {
            let fileInput = document.getElementById("fileInput");
            let formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                let response = await fetch(`${API_URL}/upload`, {
                    method: "POST",
                    body: formData
                });

                let data = await response.json();
                alert("File uploaded successfully!");
            } catch (error) {
                console.error("File upload error:", error);
            }
        }
    </script>
</body>
</html>
